<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #2c3e50; }
  .container {
    background: linear-gradient(135deg, #1e2a38 0%, #344463 100%);
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center;
  }
  .timer-container { display: flex; justify-content: center; margin: 20px 0; }
  .time-unit { width: 70px; }
  .number { font-size: 2.5rem; font-weight: bold; color: #ffcc00; display: block; }
  .label { font-size: 0.8rem; opacity: 0.8; }
  .btn {
    background: #fff; color: #344463; width: 80%; padding: 12px 0; border-radius: 30px;
    text-decoration: none; font-weight: bold; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<div class="container">
  <h1 id="status-title">活動開幕倒數中</h1>
  <div class="timer-container">
    <div class="time-unit"><span class="number" id="days">00</span><span class="label">日</span></div>
    <div class="time-unit"><span class="number" id="hours">00</span><span class="label">時</span></div>
    <div class="time-unit"><span class="number" id="mins">00</span><span class="label">分</span></div>
    <div class="time-unit"><span class="number" id="secs">00</span><span class="label">秒</span></div>
  </div>
  <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=活動開幕式&dates=20260518T100000/20260518T120000" target="_blank" class="btn">立即標記行事曆</a>
</div>
<script>
  const targetDate = new Date("May 18, 2026 10:00:00").getTime();
  function update() {
    const now = new Date().getTime();
    const d = targetDate - now;
    if (d < 0) { document.getElementById("status-title").innerHTML = "活動進行中！"; return; }
    document.getElementById("days").innerText = Math.floor(d / 86400000).toString().padStart(2, '0');
    document.getElementById("hours").innerText = Math.floor((d % 86400000) / 3600000).toString().padStart(2, '0');
    document.getElementById("mins").innerText = Math.floor((d % 3600000) / 60000).toString().padStart(2, '0');
    document.getElementById("secs").innerText = Math.floor((d % 60000) / 1000).toString().padStart(2, '0');
  }
  setInterval(update, 1000);
  update();
</script>
</body>
</html>
