<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: "Microsoft JhengHei", sans-serif; background-color: #2c3e50; overflow: hidden; }
    .container {
      background: linear-gradient(135deg, #1e2a38 0%, #344463 100%);
      height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 10px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 10px 0; letter-spacing: 2px; }
    .timer-container { display: flex; justify-content: center; width: 100%; margin-bottom: 15px; }
    .time-unit { display: flex; flex-direction: column; width: 60px; }
    .number { font-size: 2.2rem; font-weight: bold; color: #ffcc00; }
    .label { font-size: 0.75rem; margin-top: 5px; opacity: 0.8; }
    .btn {
      background-color: #ffffff; color: #344463; width: 85%; padding: 12px 0; border-radius: 25px;
      text-decoration: none; font-size: 1rem; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="status-title">活動開幕式倒數中</h1>
    <div class="timer-container">
      <div class="time-unit"><span class="number" id="days">00</span><span class="label">日</span></div>
      <div class="time-unit"><span class="number" id="hours">00</span><span class="label">時</span></div>
      <div class="time-unit"><span class="number" id="mins">00</span><span class="label">分</span></div>
      <div class="time-unit"><span class="number" id="secs">00</span><span class="label">秒</span></div>
    </div>
    <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=活動開幕式&dates=20260518T100000/20260518T120000&details=歡迎參加活動！" target="_blank" class="btn">立即標記行事曆</a>
  </div>

  <script>
    const targetDate = new Date("May 18, 2026 10:00:00").getTime();
    function updateTimer() {
      const now = new Date().getTime();
      const distance = targetDate - now;
      if (distance < 0) {
        document.getElementById("status-title").innerHTML = "活動已經開始！";
        return;
      }
      document.getElementById("days").innerText = String(Math.floor(distance / (1000 * 60 * 60 * 24))).padStart(2, '0');
      document.getElementById("hours").innerText = String(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
      document.getElementById("mins").innerText = String(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
      document.getElementById("secs").innerText = String(Math.floor((distance % (1000 * 60)) / 1000)).padStart(2, '0');
    }
    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
